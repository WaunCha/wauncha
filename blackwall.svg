  <rect class="rain" x="752" y="-56" width="2" height="56" fill="url(#drip)" opacity="0.45" style="animation-duration:3.5s;animation-delay:-0.8s"/>
  <rect class="rain" x="208" y="-30" width="2" height="30" fill="url(#drip)" opacity="0.28" style="animation-duration:5.2s;animation-delay:-3.0s"/>
  <rect class="rain" x="792" y="-48" width="2" height="48" fill="url(#drip)" opacity="0.38" style="animation-duration:3.0s;animation-delay:-1.5s"/>
  
