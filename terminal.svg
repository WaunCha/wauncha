<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 322" width="620" height="322" role="img" aria-label="whoami">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12000a"/><stop offset="100%" stop-color="#040001"/>
    </linearGradient>
    <pattern id="tscan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" opacity="0.30"/>
