        56.4%,97%{width:376px}
        97.5%,100%{width:0}
      }
      @keyframes t10 {
        0%,59.3%{width:0}
        65.7%,97%{width:292px}
        97.5%,100%{width:0}
      }
      @keyframes cur { 0%,64%{opacity:0} 66%{opacity:1} 72%{opacity:0} 78%{opacity:1}
                        84%{opacity:0} 90%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      .cursor { animation:cur 14.0s steps(1,end) infinite; }
      @keyframes edge { 0%,100%{opacity:.35} 50%{opacity:.75} }
      .frame { animation:edge 3.4s ease-in-out infinite; }
      @media (prefers-reduced-motion:reduce){ .ty,.cursor,.frame{animation:none} }
