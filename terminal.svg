              font-size:14.0px; letter-spacing:0; }
      .chrome { font-size:11px; letter-spacing:2px; fill:#6b4a50; }
      .ty { animation-duration:14.0s; animation-timing-function:steps(28,end);
             animation-iteration-count:infinite; }
      @keyframes t0 {
        0%,2.1%{width:0}
        9.3%,97%{width:208px}
        97.5%,100%{width:0}
      }
