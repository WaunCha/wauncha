<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 194" width="880" height="194" role="img" aria-label="stack">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12000a"/><stop offset="100%" stop-color="#040001"/>
    </linearGradient>
    <pattern id="sscan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" opacity="0.30"/>
    </pattern>
    <filter id="sglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:13.0px; }
      .chrome { font-size:11px; letter-spacing:2px; fill:#6b4a50; }
      @keyframes edge { 0%,100%{opacity:.35} 50%{opacity:.75} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .frame { animation:edge 3.4s ease-in-out infinite; }
      .cursor { animation:blink 1.05s steps(1,end) infinite; }
      @media (prefers-reduced-motion:reduce){ .frame,.cursor{animation:none} }
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="192" rx="4" fill="url(#sbg)"/>
  <rect x="1" y="1" width="878" height="30" rx="4" fill="#1a0008"/>
  <rect x="1" y="26" width="878" height="6" fill="#1a0008"/>
  <circle cx="20" cy="16" r="4.5" fill="#ff0033"/>
  <circle cx="37" cy="16" r="4.5" fill="#8b0010"/>
  <circle cx="54" cy="16" r="4.5" fill="#3d0008"/>
  <text class="chrome" x="440.0" y="20" text-anchor="middle">waun@blackwall — stack — 120x8</text>
  <g filter="url(#sglow)">
    <text x="26" y="52"><tspan fill="#ff0033" font-weight="700">waun@blackwall</tspan><tspan fill="#6b4a50">:</tspan><tspan fill="#ff7d8f">~</tspan><tspan fill="#6b4a50">$ </tspan><tspan fill="#f0e2e5">cat stack.txt</tspan></text>
    <text x="26" y="78"><tspan fill="#ff0033" font-weight="700" xml:space="preserve">CLOUD    </tspan><tspan fill="#f0e2e5">aws · azure</tspan></text>
    <text x="26" y="104"><tspan fill="#ff0033" font-weight="700" xml:space="preserve">IAC/CI   </tspan><tspan fill="#f0e2e5">terraform · ansible · gitlab-ci</tspan></text>
    <text x="26" y="130"><tspan fill="#ff0033" font-weight="700" xml:space="preserve">RUNTIME  </tspan><tspan fill="#f0e2e5">docker · kubernetes · linux</tspan></text>
    <text x="470" y="78"><tspan fill="#ff0033" font-weight="700" xml:space="preserve">DETECT   </tspan><tspan fill="#f0e2e5">sentinel · splunk · elastic</tspan></text>
    <text x="470" y="104"><tspan fill="#ff0033" font-weight="700" xml:space="preserve">SAST     </tspan><tspan fill="#f0e2e5">sonarqube · trivy</tspan></text>
    <text x="470" y="130"><tspan fill="#ff0033" font-weight="700" xml:space="preserve">LANG     </tspan><tspan fill="#f0e2e5">python · bash</tspan></text>
    <text x="26" y="162"><tspan fill="#ff0033" font-weight="700">waun@blackwall</tspan><tspan fill="#6b4a50">:</tspan><tspan fill="#ff7d8f">~</tspan><tspan fill="#6b4a50">$ </tspan></text>
    <rect class="cursor" x="159" y="150" width="8" height="15.0" fill="#ff0033"/>
  </g>
  <rect x="1" y="1" width="878" height="192" fill="url(#sscan)"/>
  <rect class="frame" x="1" y="1" width="878" height="192" rx="4" fill="none" stroke="#ff0033" stroke-width="1.2"/>
</svg>
