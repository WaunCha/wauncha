    <style>
      @keyframes jit {
        0%,7%,100%{transform:translate(0,0)} 8%{transform:translate(-3px,1px)}
        9%{transform:translate(2px,-1px)} 10%,37%{transform:translate(0,0)}
        38%{transform:translate(3px,0)} 39%{transform:translate(-2px,1px)}
        40%,71%{transform:translate(0,0)} 72%{transform:translate(-2px,-1px)}
        73.5%{transform:translate(4px,1px)} 75%{transform:translate(0,0)}
      }
      @keyframes ghostR {
        0%,7%,100%{transform:translate(0,0);opacity:0} 8%{transform:translate(-7px,0);opacity:.9}
        10%{opacity:0} 37%{opacity:0} 38%{transform:translate(6px,0);opacity:.85}
        40%{opacity:0} 71%{opacity:0} 72%{transform:translate(-5px,2px);opacity:.9} 75%{opacity:0}
      }
      @keyframes ghostW {
        0%,7%,100%{transform:translate(0,0);opacity:0} 8%{transform:translate(6px,0);opacity:.55}
        10%{opacity:0} 37%{opacity:0} 38%{transform:translate(-5px,0);opacity:.5}
        40%{opacity:0} 71%{opacity:0} 72%{transform:translate(4px,-2px);opacity:.55} 75%{opacity:0}
      }
      @keyframes slice1 { 0%,11%,100%{transform:translate(0,0)} 12%{transform:translate(14px,0)}
                           13.5%{transform:translate(-9px,0)} 15%{transform:translate(0,0)}
                           62%{transform:translate(0,0)} 63%{transform:translate(-16px,0)} 65%{transform:translate(0,0)} }
      @keyframes slice2 { 0%,25%,100%{transform:translate(0,0)} 26%{transform:translate(-12px,0)}
                           27.5%{transform:translate(8px,0)} 29%{transform:translate(0,0)}
                           86%{transform:translate(0,0)} 87%{transform:translate(11px,0)} 89%{transform:translate(0,0)} }
      @keyframes dim { 0%,100%{opacity:.45} 50%{opacity:.8} }
      .jit{animation:jit 6s steps(1,end) infinite}
      .gr {animation:ghostR 6s steps(1,end) infinite}
      .gw {animation:ghostW 6s steps(1,end) infinite}
      .s1 {animation:slice1 6s steps(1,end) infinite}
      .s2 {animation:slice2 6s steps(1,end) infinite}
      .cr {font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;font-size:11px;
            letter-spacing:4px;fill:#8f6a70;animation:dim 4s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){.jit,.gr,.gw,.s1,.s2,.cr{animation:none}}
    </style>
